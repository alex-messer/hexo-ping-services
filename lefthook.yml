# https://lefthook.dev/configuration/
# Run "npx lefthook install" after npm install to wire git hooks (also
# triggered automatically by the package "prepare" script).

pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{js,mjs,cjs}"
      run: npx oxlint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    test:
      run: npm test
